{% extends "base.html" %}

{% block title %}Daftar Akun | KarirLake Job Application Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-5">
    <div class="col-12 col-md-8 col-lg-5 col-xl-4">
        
        <!-- REGISTER CARD -->
        <div class="studio-card p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle mb-3" 
                     style="background: rgba(255, 110, 64, 0.12); border: 1px solid rgba(255, 110, 64, 0.3);">
                    <i class="bi bi-person-plus-fill text-warning fs-2"></i>
                </div>
                <h3 class="fw-bold mb-1" style="color: var(--text-primary); letter-spacing: -0.02em;">
                    Daftar Akun Baru
                </h3>
                <p class="text-secondary small mb-0">
                    Mulai lacak lamaran kerja impian Anda dengan analitik modern
                </p>
            </div>

            {% if error %}
            <div class="alert alert-danger d-flex align-items-center gap-2 py-2 px-3 small rounded-3 mb-4" role="alert">
                <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
                <div>{{ error }}</div>
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('auth.register') }}">
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary mb-1">Nama / Username</label>
                    <div class="input-group">
                        <span class="input-group-text input-group-text-studio">
                            <i class="bi bi-person"></i>
                        </span>
                        <input type="text" name="username" class="form-control form-control-studio" 
                               placeholder="Contoh: Budi Santoso" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary mb-1">Email</label>
                    <div class="input-group">
                        <span class="input-group-text input-group-text-studio">
                            <i class="bi bi-envelope"></i>
                        </span>
                        <input type="email" name="email" class="form-control form-control-studio" 
                               placeholder="nama@email.com" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary mb-1">Kata Sandi (Min 6 Karakter)</label>
                    <div class="input-group">
                        <span class="input-group-text input-group-text-studio">
                            <i class="bi bi-key"></i>
                        </span>
                        <input type="password" name="password" class="form-control form-control-studio" 
                               placeholder="••••••••" required minlength="6">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold text-secondary mb-1">Ulangi Kata Sandi</label>
                    <div class="input-group">
                        <span class="input-group-text input-group-text-studio">
                            <i class="bi bi-check2-circle"></i>
                        </span>
                        <input type="password" name="confirm_password" class="form-control form-control-studio" 
                               placeholder="••••••••" required minlength="6">
                    </div>
                </div>

                <button type="submit" class="btn btn-apply w-100 py-2 fw-bold mb-3 justify-content-center">
                    <span>Buat Akun Sekarang</span>
                    <i class="bi bi-arrow-right"></i>
                </button>
            </form>

            <div class="text-center pt-2 border-top border-secondary border-opacity-10">
                <span class="text-secondary small">Sudah punya akun?</span>
                <a href="{{ url_for('auth.login') }}" class="small fw-bold ms-1" style="color: var(--accent-orange);">
                    Masuk di sini
                </a>
            </div>
        </div>

    </div>
</div>
{% endblock %}
